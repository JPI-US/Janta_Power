name: Rust Build Check

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: cargo build --workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Rust environment
        uses: ./.github/actions/setup-rust

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip python3-venv \
            cmake ninja-build ccache \
            libclang-dev pkg-config libssl-dev libudev-dev

      - name: Install espup
        run: cargo install espup

      - name: Install ESP toolchain (espup)
        run: espup install

      - name: Load ESP environment
        shell: bash
        run: |
          echo "source $HOME/export-esp.sh" >> $GITHUB_ENV

      - name: Cache Cargo + ESP build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.espressif
          key: esp-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
          RUSTFLAGS: -D warnings
        run: |
          source $HOME/export-esp.sh
          cargo build --workspace --all-targets --all-features