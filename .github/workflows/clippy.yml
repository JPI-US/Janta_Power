name: Clippy

on:
  pull_request:
  push:
    branches: [master]

jobs:
  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup ESP-IDF + Rust
        uses: ./.github/actions/esp-idf-setup

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -D warnings