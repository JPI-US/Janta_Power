name: Format

on:
  pull_request:
  push:
    branches: [master]

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2  

      - name: Run rustfmt check
        run: cargo fmt --all -- --check