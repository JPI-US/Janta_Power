name: ESP-IDF Setup (Rust + ESP32-S3)

description: Sets up ESP-IDF + ESP Rust toolchain

runs:
  using: "composite"

  steps:
    - name: Install espup
      shell: bash
      run: cargo install espup

    - name: Install ESP Rust toolchain
      shell: bash
      run: espup install

    - name: Load ESP environment
      shell: bash
      run: echo "source $HOME/export-esp.sh" >> $GITHUB_ENV

    - name: Cache ESP-IDF + tools
      uses: actions/cache@v4
      with:
        path: |
          $HOME/esp-idf
          $HOME/.espressif
        key: esp-idf-v5.2.2-${{ runner.os }}-v1
        restore-keys: |
          esp-idf-v5.2.2-${{ runner.os }}-

    - name: Setup ESP-IDF
      shell: bash
      run: |
        set -e
        if [ ! -d "$HOME/esp-idf/.git" ]; then
          git clone --branch v5.2.2 --depth 1 --recursive https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          "$HOME/esp-idf/install.sh" esp32s3
        fi

    - name: Export ESP-IDF env
      shell: bash
      run: echo "source $HOME/esp-idf/export.sh" >> $GITHUB_ENV