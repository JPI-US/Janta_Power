name: Setup Rust environment
description: Installs the esp-rs Rust toolchain (Xtensa/RISC-V fork via espup) used across CI jobs

inputs:
  buildtargets:
    description: Comma-separated list of esp chip targets (e.g. esp32, esp32s3, esp32c3)
    required: false
    default: esp32s3
  version:
    description: Rust toolchain version to install (matches [toolchain].version in rust-toolchain.toml, if pinned)
    required: false
    default: ''
  ldproxy:
    description: Whether to install ldproxy
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install esp Rust toolchain
      uses: esp-rs/xtensa-toolchain@v1.5
      with:
        default: true
        buildtargets: ${{ inputs.buildtargets }}
        ldproxy: ${{ inputs.ldproxy }}