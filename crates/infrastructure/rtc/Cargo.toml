[package]
name = "rtc"
version = "0.1.0"
edition = "2021"
description = "DS3231 RTC + SNTP fallback + libc TZ"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
ds323x.workspace = true
embedded-hal.workspace = true
esp-idf-svc = { workspace = true, features = [
    "critical-section",
    "embassy-time-driver",
    "embassy-sync",
] }
libc.workspace = true
log.workspace = true
shared-bus = { workspace = true, features = [
    "std",
] }
wifi.workspace = true
