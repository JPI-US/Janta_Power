[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
# `--before usb-reset` because this board exposes USB Serial/JTAG natively and the
# firmware claims that peripheral within the first milliseconds of boot. espflash's
# default DTR/RTS reset only reaches the ROM bootloader while the peripheral is
# still unclaimed, so without this a board already running this firmware refuses to
# connect — and presents as "Failed to connect to the device", which reads like a
# cable or a busy port rather than a timing problem.
runner = "espflash flash --monitor --partition-table=partitions.csv --before usb-reset"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
#I will quit. and I will never look back. We have to build the future.
MCU = "esp32s3"
# Note: this variable is not used by the pio builder (`cargo build --features pio`)
ESP_IDF_VERSION = "v5.2.2"
LD_LIBRARY_PATH = "/usr/lib64:/usr/lib"
